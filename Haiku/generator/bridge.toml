# The Haiku bridge's annotations: what the headers cannot say (design
# section 10). mojobe_gen.py reads the headers through clang and this file,
# and writes libmojobe and the `haiku` package's generated modules.

# The headers the bridge covers; their constants, and those of the headers
# they include from the same kit directories, become Mojo constants.
headers = [
	"Handler.h",
	"Looper.h",
	"Messenger.h",
	"Application.h",
	"Window.h",
	"View.h",
	"Message.h",
	"Menu.h",
	"MenuBar.h",
	"MenuItem.h",
	"PopUpMenu.h",
	"Invoker.h",
	"Control.h",
	"Button.h",
	"CheckBox.h",
	"RadioButton.h",
	"TextControl.h",
	"Slider.h",
	"StringView.h",
	"ScrollView.h",
	"ListView.h",
	"ListItem.h",
	"Alert.h",
	"MessageRunner.h",
	"Font.h",
	"Region.h",
	"Bitmap.h",
	"Screen.h",
	"Size.h",
	"Alignment.h",
	"LayoutItem.h",
	"Layout.h",
	"GroupLayout.h",
	"GridLayout.h",
	"SpaceLayoutItem.h",
	"GroupView.h",
	"GridView.h",
	"Entry.h",
	"Path.h",
	"FilePanel.h",
	"FindDirectory.h",
	"GamePane.h",
	"ChipPlayer.h",
]
constant_dirs = [
	"os/app", "os/game", "os/interface", "os/kernel", "os/storage", "os/support",
]

# Free functions.
functions = ["find_directory", "get_key_info", "modifiers"]

# Static methods that make an object the caller owns.
factories = [
	"BListView::RemoveItem",  # the item the list gave up, now the caller's
	"BSpaceLayoutItem::CreateGlue",
	"BSpaceLayoutItem::CreateHorizontalStrut",
	"BSpaceLayoutItem::CreateVerticalStrut",
]

# The libraries libmojobe links, where every method it calls that is neither
# virtual nor defined in a header must be defined (BFilePanel is Tracker's).
libraries = ["libbe.so", "libroot.so", "libtracker.so", "libgame.so"]

# Value types: copied, laid out in Mojo as in C++. A type that C++ cannot
# pass in registers (a user-declared copy constructor makes BRect and BPoint
# so) crosses the C interface as a plain C struct of the same fields.
[values.BRect]
methods = true             # its inline methods, compiled in: C++'s own
[values.BPoint]
methods = true
[values.rgb_color]

[values.BSize]
[values.BAlignment]
[values.key_info]
# uint32 modifiers, then uint8 key_states[16]: four UInt32 in Mojo keep the
# offsets C's (a UInt64 would be aligned to 8).
mojo_fields = [
	["modifiers", "UInt32"], ["states0", "UInt32"], ["states1", "UInt32"],
	["states2", "UInt32"], ["states3", "UInt32"],
]

[values.font_height]
[values.clipping_rect]
[values.screen_id]

[values.pattern]
# uint8 data[8]: one register in C, and so a UInt64 in Mojo, where an array
# of bytes would not be laid out for C.
mojo_fields = [["data", "UInt64"]]

# Classes. kind: "value" -- held in a Mojo value, C++ constructing it in
# place, for classes whose copy and destructor do no more than copy bytes;
# "owned" -- Mojo deletes it unless something adopts it;
# "self-owning" -- handed to the system by one of `hands_over`, and deleted
# otherwise by `destroy`. shadow: Mojo types may stand behind it, with these
# hooks (the Be Book's hook functions).
[classes.BMessenger]
kind = "value"             # held in a Mojo value: its copy constructor and
                           # destructor copy three integers and do nothing
init_check = "result"

[classes.BFont]
kind = "value"             # its copy copies fields; it has no destructor

[classes.BHandler]
kind = "owned"             # a looper borrows its handlers: ~BHandler leaves it
shadow = true
hooks = ["MessageReceived"]

[classes.BLooper]
kind = "self-owning"
hands_over = ["Run", "Quit"]
destroy = "quit"           # never run: locked, then Quit(), which deletes it
shadow = true
hooks = ["MessageReceived", "QuitRequested"]

[classes.BApplication]
kind = "owned"
init_check = "error"       # the constructors' status_t* out-parameter raises
shadow = true
hooks = [
	"ReadyToRun", "MessageReceived", "QuitRequested", "AboutRequested",
	"Pulse", "RefsReceived",
]

[classes.BWindow]
kind = "self-owning"
hands_over = ["Show", "Quit"]
destroy = "quit"           # never shown: locked, then Quit()
shadow = true
hooks = [
	"MessageReceived", "QuitRequested", "FrameMoved", "FrameResized",
	"WindowActivated", "WorkspaceActivated", "MenusBeginning", "MenusEnded",
	"Zoom", "Minimize",
]

[classes.BView]
kind = "owned"
shadow = true
hooks = [
	"Draw", "DrawAfterChildren", "MouseDown", "MouseUp", "MouseMoved",
	"KeyDown", "KeyUp", "MessageReceived", "AttachedToWindow",
	"AllAttached", "DetachedFromWindow", "AllDetached", "FrameMoved",
	"FrameResized", "WindowActivated", "Pulse",
]

[classes.BMessage]
kind = "owned"
# `what` is a public field; a reference reads it when it is made.
ref_fields = ["what"]

[classes.BMenu]
kind = "owned"

[classes.BMenuBar]
kind = "owned"

[classes.BMenuItem]
kind = "owned"

[classes.BPopUpMenu]
kind = "owned"

# Controls: a BInvoker sends its message; a BControl is a view that is one.
[classes.BInvoker]
kind = "owned"

[classes.BControl]
kind = "owned"

[classes.BButton]
kind = "owned"

[classes.BCheckBox]
kind = "owned"

[classes.BRadioButton]
kind = "owned"

[classes.BTextControl]
kind = "owned"

[classes.BSlider]
kind = "owned"

[classes.BStringView]
kind = "owned"

[classes.BScrollView]
kind = "owned"

# A BListView does not delete its items. The bridge's does: every list view
# Mojo makes is the bridge's subclass (owns_items), which deletes the items
# left in it; AddItem adopts, and RemoveItem(index) gives the item back.
[classes.BListView]
kind = "owned"
shadow = true
hooks = ["SelectionChanged"]
owns_items = true

[classes.BListItem]
kind = "owned"

[classes.BStringItem]
kind = "owned"

[classes.BAlert]
kind = "self-owning"
hands_over = ["Go"]        # runs it, and it quits (deletes itself)
destroy = "quit"

[classes.BRegion]
kind = "owned"

[classes.BBitmap]
kind = "owned"
init_check = "InitCheck()"

[classes.BScreen]
kind = "owned"

# Layouts: a view's layout places its children; a layout adopts the views
# and items added to it, and a view the layout set on it.
[classes.BLayoutItem]
kind = "owned"

[classes.BLayout]
kind = "owned"

[classes.BGroupLayout]
kind = "owned"

[classes.BGridLayout]
kind = "owned"

[classes.BSpaceLayoutItem]
kind = "owned"

[classes.BGroupView]
kind = "owned"

[classes.BGridView]
kind = "owned"

# The storage kit: paths, entries, file panels.
[classes.entry_ref]
kind = "owned"             # its name is a string it owns: not a value class

[classes.BEntry]
kind = "owned"

[classes.BPath]
kind = "owned"

[classes.BFilePanel]
kind = "owned"

# Prose's game kit: the game pane (a window), and the chip player.
[classes.BGamePane]
kind = "self-owning"
hands_over = ["Show", "Quit"]
destroy = "quit"
init_check = "InitCheck()"
shadow = true
hooks = ["MessageReceived", "QuitRequested", "WindowActivated"]

[classes.BChipPlayer]
kind = "owned"
init_check = "InitCheck()"

[classes.BMessageRunner]
kind = "owned"
init_check = "InitCheck()" # the constructors report only through InitCheck()

# Parameters that hand an object to the receiver, by method or constructor
# ("Class::Name"), from the Be Book.
[adopts]
"BWindow::AddChild" = ["child"]
"BView::AddChild" = ["child"]
"BMenu::AddItem" = ["item", "menu"]
"BMenuItem::BMenuItem" = ["message", "menu"]
"BInvoker::SetMessage" = ["message"]
"BInvoker::BInvoker" = ["message"]
"BControl::BControl" = ["message"]
"BButton::BButton" = ["message"]
"BCheckBox::BCheckBox" = ["message"]
"BRadioButton::BRadioButton" = ["message"]
"BTextControl::BTextControl" = ["message"]
"BTextControl::SetModificationMessage" = ["message"]
"BSlider::BSlider" = ["message"]
"BSlider::SetModificationMessage" = ["message"]
"BScrollView::BScrollView" = ["target"]
"BListView::AddItem" = ["item"]
"BAlert::Go" = ["invoker"]         # ~BAlert never deletes it (Haiku leaks it)
"BBitmap::AddChild" = ["view"]     # ~BBitmap deletes its window, and its views
"BView::SetLayout" = ["layout"]
"BWindow::SetLayout" = ["layout"]
"BGroupView::SetLayout" = ["layout"]
"BGridView::SetLayout" = ["layout"]
"BLayout::AddView" = ["child"]
"BLayout::AddItem" = ["item"]
"BGroupLayout::AddView" = ["child"]
"BGroupLayout::AddItem" = ["item"]
"BGridLayout::AddView" = ["child"]
"BGridLayout::AddItem" = ["item"]

# Methods left out, and why. Also left out without being named here: what
# uses a type the bridge does not carry yet (the manifest says which).
[skip]
"BArchivable::Archive" = "archives come with BArchivable"
"BArchivable::Perform" = "binary compatibility hook"
"BHandler::Perform" = "binary compatibility hook"
"BLooper::Perform" = "binary compatibility hook"
"BView::Perform" = "binary compatibility hook"
"BWindow::Perform" = "binary compatibility hook"
"BApplication::Perform" = "binary compatibility hook"
"BMenu::Perform" = "binary compatibility hook"
"BMenuBar::Perform" = "binary compatibility hook"
"BMenuItem::Perform" = "binary compatibility hook"
"BWindow::Run" = "Show() runs the window"
"BHandler::SetLooper" = "the looper sets it"
"BListView::RemoveItem(BListItem*)" = "leaves the item to no one: RemoveItem(index) gives it back"
"BListView::RemoveItems" = "leaves the items to no one: RemoveItem(index) gives each back"
"BListView::MakeEmpty" = "leaves the items to no one: RemoveItem(index) gives each back"

# Pointer parameters that are read and written (the rest are results).
[inout]
"BView::ConvertToScreen" = ["point", "rect"]
"BView::ConvertFromScreen" = ["point", "rect"]
"BView::ConvertToParent" = ["point", "rect"]
"BView::ConvertFromParent" = ["point", "rect"]
"BWindow::ConvertToScreen" = ["point", "rect"]
"BWindow::ConvertFromScreen" = ["point", "rect"]

# A `void*` result that is a buffer, and the method that says how long it is:
# a Span of its bytes, borrowed from the object.
[spans]
"BBitmap::Bits" = "BitsLength"
"BGamePane::World" = "self.BytesPerRow() * self.WorldHeight()"
"BGamePane::RowAt" = "self.BytesPerRow()"

# `const T*` buffers whose length the other arguments give: a Span, checked
# against that length (the method raises when it is short).
[checked_spans]
"BGamePane::Blit" = { source = "Int(sourceStride) * Int(height)" }
"BGamePane::DefineSprite" = { pixels = "Int(width) * Int(height)" }  # a byte a pixel at any depth

# Pointers to values held in Mojo (BMessenger) that the method reads; the
# rest are results.
[in]
"BFilePanel::BFilePanel" = ["target"]
